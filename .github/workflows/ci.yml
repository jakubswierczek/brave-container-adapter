name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Check repository
        run: scripts/check-repo.py
      - name: Test
        run: scripts/test.sh
      - name: Build CLI
        run: scripts/build.sh
      - name: Package universal DMG
        run: scripts/package-setup.sh
